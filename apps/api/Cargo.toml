[package]
name = "pilly-api"
version = "0.1.0"
edition = "2024"
default-run = "pilly-api"

[[bin]]
name = "pilly-api"
path = "src/main.rs"

[[bin]]
name = "sync_pills"
path = "src/bin/sync_pills.rs"

[dependencies]
# 런타임 & 웹 프레임워크
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = { version = "0.8", features = ["multipart", "macros"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }

# 전역 메모리 할당자
mimalloc = "0.1"

# 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# 데이터베이스 (SQLx PostgreSQL)
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "migrate"] }

# 메시지 스트리밍 (Apache Iggy)
iggy = "0.6"

# 인메모리 캐시
dashmap = "6"
moka = { version = "0.12", features = ["future"] }

# 인증 & 보안 (JWT, AES-256-GCM)
jsonwebtoken = "9"
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.22"
sha1 = "0.10"

# HTTP 클라이언트 (Gemini AI, 공공데이터 API, Cloudinary, JWKS)
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls"] }

# 유틸리티 & 로깅 & 에러 처리
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
futures = "0.3"
bytes = "1"

# 이메일 발송 (SMTP)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
http-body-util = "0.1"
